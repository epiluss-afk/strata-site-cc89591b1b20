const memory=game.Rule==='pairs', dodge=game.Rule==='dodge';
let running=false, score=0, deadline=0, last=0, frame=0, pos=.5, fx=.5, fy=0, shown=[], pendingFlip=0;
let ctx, buffer, preparing;
const keys=new Set(), pointers=new Map(), notes=new Set();
const catching=game.Rule==='catch', engine=window.strataCatch;
let trace, simulation, paused=false;
function sendScene(tape){if(parent!==window)parent.postMessage({type:'strata-scene',tape},'*')}
function drive(dt){
    const dir=Number(keys.has('ArrowRight')||[...pointers.values()].includes(1))-Number(keys.has('ArrowLeft')||[...pointers.values()].includes(-1));
    if(dir)move(pos+dir*dt*.85);
}
function advanceCatch(now){
    const due=Math.min(game.Seconds*engine.hz,Math.floor((now-deadline+game.Seconds*1000)*engine.hz/1000));
    while(trace.Positions.length<due){
        drive(1/engine.hz);
        const input=Math.round(pos*10000);trace.Positions.push(input);
        if(engine.step(simulation,input/10000,game))point();
    }
    flower.style.left=simulation.x*100+'%';flower.style.top=simulation.y*100+'%';
}
function pauseGame(){
    if(!catching||(!running&&!paused))return;
    if(paused){
        paused=false;running=true;last=performance.now();deadline=last+(game.Seconds-trace.Positions.length/engine.hz)*1000;
        el('pause').textContent='일시정지';sendScene(null);frame=requestAnimationFrame(tick);field.focus();return;
    }
    const now=performance.now();if(now>=deadline){tick(now);return}
    advanceCatch(now);running=false;paused=true;cancelAnimationFrame(frame);keys.clear();pointers.clear();
    el('pause').textContent='계속 플레이';el('time').textContent=Math.ceil(game.Seconds-trace.Positions.length/engine.hz);
    sendScene({...trace,Score:score,Misses:simulation.misses});
}
el('pause').onclick=pauseGame;
function audioError(){el('soundStatus').textContent='오디오 출력을 열 수 없습니다. 장치 설정을 확인해 주세요.'}
function unlock(){
    try {
        ctx ??= new AudioContext();
        ctx.resume().catch(audioError);
        preparing ??= ctx.decodeAudioData(Uint8Array.from(atob(el('cue').src.split(',')[1]),c=>c.charCodeAt(0)).buffer)
            .then(value=>buffer=value).catch(audioError);
    } catch {audioError()}
}
function sound(){
    if(!buffer || !ctx) return;
    const note=ctx.createBufferSource();note.buffer=buffer;note.connect(ctx.destination);
    notes.add(note);note.onended=()=>{notes.delete(note);note.disconnect()};note.start();
}
function point(){el('score').textContent=++score;sound()}
function move(x){pos=Math.min(.91,Math.max(.09,x));basket.style.left=pos*100+'%'}
function spawn(first=false){fx=first?.5:.09+Math.random()*.82;fy=0;flower.style.left=fx*100+'%';flower.style.top='0%'}
function fall(dt){
    drive(dt);
    const prev=fy;fy+=dt*(.37+Math.min(score,12)*.012);
    if(prev<.85 && fy>=.85 && Math.abs(fx-pos)<=.105){
        if(dodge){finish('부딪혔어요');return}
        point();spawn();return;
    }
    if(fy>=1.04){if(dodge)point();spawn();return}
    flower.style.top=fy*100+'%';
}
function tick(now){
    if(!running)return;
    const remaining=Math.max(0,Math.ceil((deadline-now)/1000));
    el('time').textContent=remaining;
    if(catching)advanceCatch(now);
    if(!remaining){finish('시간 종료');return}
    if(dodge)fall(Math.min((now-last)/1000,.09));
    last=now;if(running)frame=requestAnimationFrame(tick);
}
function finish(label){
    el('pause').hidden=true;
    running=false;cancelAnimationFrame(frame);clearTimeout(pendingFlip);keys.clear();pointers.clear();
    el('result').textContent=label+' · '+score+'점';el('start').textContent='다시 시작';el('panel').hidden=false;
    flower.hidden=true;el('start').focus();
}
function flip(button){
    if(!running||button.disabled||shown.length===2)return;
    button.disabled=true;button.textContent=button.dataset.face;shown.push(button);
    if(shown.length!==2)return;
    if(shown[0].dataset.face===shown[1].dataset.face){point();shown=[];if(score===4)finish('모두 찾았어요');return}
    pendingFlip=setTimeout(()=>{for(const b of shown){b.textContent='?';b.disabled=false}shown=[]},650);
}
function deck(){
    const faces=[...new Set([game.Item,'🍀','🌻','🌹','🍋'])].slice(0,4);
    const values=[...faces,...faces];
    for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}
    el('cards').replaceChildren(...values.map(face=>{const b=document.createElement('button');b.textContent='?';b.dataset.face=face;b.onclick=()=>flip(b);return b}));
}
function start(){
    if(running)return;unlock();for(const note of notes)note.stop();
    keys.clear();pointers.clear();shown=[];score=0;el('score').textContent='0';el('time').textContent=game.Seconds;
    el('panel').hidden=true;flower.hidden=memory;running=true;move(.5);
    if(memory)deck();else spawn(true);
    if(catching){
        trace={Seed:crypto.getRandomValues(new Uint32Array(1))[0],Positions:[]};simulation=engine.initial(trace.Seed);
        basket.style.width=18*(game.Width??1)+'%';el('pause').hidden=false;el('pause').textContent='일시정지';sendScene(null);
    }
    last=performance.now();deadline=last+game.Seconds*1000;frame=requestAnimationFrame(tick);field.focus({preventScroll:true});
}
function steer(e){const r=field.getBoundingClientRect();move((e.clientX-r.left)/r.width)}
field.onpointerdown=e=>{if(running&&!memory){field.setPointerCapture(e.pointerId);steer(e)}};
field.onpointermove=e=>{if(running&&!memory&&field.hasPointerCapture(e.pointerId))steer(e)};
for(const [id,dir] of [['left',-1],['right',1]]){
    const b=el(id);b.onpointerdown=e=>{if(running){b.setPointerCapture(e.pointerId);pointers.set(e.pointerId,dir);move(pos+.045*dir)}};
    b.onlostpointercapture= b.onpointerup= b.onpointercancel=e=>pointers.delete(e.pointerId);
}
addEventListener('keydown',e=>{if(!memory&&running&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();keys.add(e.key)}});
addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{keys.clear();pointers.clear()});
field.tabIndex=-1;el('start').onclick=start;el('time').textContent=game.Seconds;flower.textContent=game.Item;move(.5);
el('result').textContent=memory?'같은 그림 찾기':dodge?'떨어지는 물체 피하기':'바구니에 담아 보세요';
el('guide').textContent=memory?'카드 두 장을 골라 같은 그림을 찾으세요.':'키보드 ← → 또는 화면을 터치하거나 끌어 바구니를 움직이세요.';
basket.hidden=memory;el('cards').hidden=!memory;document.querySelector('.controls').hidden=memory;
</script></body></html>
